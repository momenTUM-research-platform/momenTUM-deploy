services:
  dashboard-api:
    env_file:
      - ../dashboard/backend/.env
    depends_on:
      - postgres
    networks:
      - web
    restart: unless-stopped

  dashboard-frontend:
    networks:
      - web
    restart: unless-stopped

  designer-backend:
    build:
      context: ../designer/backend
      dockerfile: Dockerfile
    volumes:
      - ../designer/backend:/app
      - ../designer/studies:/app/studies
    expose:
      - "8000"
    env_file:
      - ../designer/backend/.env
    networks:
      - web
    restart: unless-stopped

  designer-frontend:
    build:
      context: ../designer/frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    networks:
      - web
    restart: unless-stopped

  postgres:
    image: postgres:14
    env_file:
      - ../dashboard/backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  node_modules_dashboard:
  caddy_data:
  caddy_config:

networks:
  web:
    driver: bridge